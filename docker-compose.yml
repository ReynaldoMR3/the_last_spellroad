services:
  game:
    build:
      context: .
      target: development
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - spellroad_node_modules:/app/node_modules
    environment:
      npm_config_update_notifier: "false"

volumes:
  spellroad_node_modules:
