services:
  game:
    build:
      context: .
      target: development
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - spellroad_node_modules:/app/node_modules
    environment:
      npm_config_update_notifier: "false"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - spellroad_ollama_models:/root/.ollama

  agent-crew:
    build:
      context: ./agent-crew
    working_dir: /app
    env_file:
      - ./agent-crew/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./agent-crew:/app
    depends_on:
      - ollama

  content-pipeline:
    build:
      context: ./content-pipeline
    working_dir: /app
    env_file:
      - ./content-pipeline/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      GDD_PATH: /app/gdd/the-last-spellroad-design.md
    volumes:
      - ./content-pipeline:/app
      - ./docs/game:/app/gdd:ro
    depends_on:
      - ollama

volumes:
  spellroad_node_modules:
  spellroad_ollama_models:
